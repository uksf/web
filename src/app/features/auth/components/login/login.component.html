<div>
    <h2 mat-dialog-title>Login</h2>
    <form #form="ngForm" (ngSubmit)="submit()">
        <div class="special-field-form-container" aria-hidden="true">
            <label for="name">If you see this, keep this field blank</label>
            <input type="text" id="name" name="formName" [(ngModel)]="model.name" tabindex="-1" autocomplete="off" data-bwignore data-1p-ignore data-lpignore="true" [maxLength]="0" />
        </div>
        <app-text-input
            class="full-width"
            label="Email Address"
            type="email"
            name="email"
            [(ngModel)]="model.email"
            autocomplete="username webauthn"
            [required]="true"
            email
            [validationMessages]="validationMessages.email"
        >
        </app-text-input>
        <app-text-input
            class="full-width"
            label="Password"
            type="password"
            name="password"
            [(ngModel)]="model.password"
            autocomplete="current-password"
            [required]="true"
            [validationMessages]="validationMessages.password"
        >
        </app-text-input>
        <app-button-hidden-submit></app-button-hidden-submit>
    </form>
    <div class="options-container">
        <mat-checkbox color="primary" [(ngModel)]="stayLogged">Stay logged in</mat-checkbox>
        <app-flex-filler></app-flex-filler>
        <a class="option-link" (click)="requestPasswordReset()">Reset Password</a>
    </div>
    @if (loginError !== '') {
    <div class="invalid-message">
        <span>{{ loginError }}</span>
    </div>
    }
    <div class="button-container">
        <app-button (clicked)="submit()" [disabled]="!form.valid || passkeyPending" [pending]="pending">Login</app-button>
    </div>
    @if (passkeysSupported) {
    <div class="passkey-container">
        <span class="passkey-divider">or</span>
        <app-button [secondary]="true" (clicked)="loginWithPasskey()" [disabled]="pending" [pending]="passkeyPending">Sign in with a passkey</app-button>
    </div>
    }
</div>
