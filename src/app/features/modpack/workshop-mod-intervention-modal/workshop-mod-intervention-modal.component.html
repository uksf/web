<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
    <div class="flex-container">
        <div class="pbos-list-container">
            @for (row of rows; track row.name) {
                <div class="pbos-list-item-container" [ngClass]="'pbo-state-' + row.state">
                    <span class="pbo-name" [ngClass]="{ conflict: row.conflict }" [matTooltip]="getTooltip(row)" [title]="row.name">{{ row.name }}</span>
                    <div class="pbo-row-actions">
                        @if (row.conflict) {
                            <span class="pbo-badge pbo-badge-conflict">CONFLICT</span>
                        }
                        @if (row.state === 'new') {
                            <span class="pbo-badge pbo-badge-new">NEW</span>
                        }
                        @if (row.state === 'removed') {
                            <span class="pbo-badge pbo-badge-removed">REMOVED</span>
                        }
                        <mat-checkbox color="primary" [(ngModel)]="row.selected" [disabled]="row.disabled"></mat-checkbox>
                    </div>
                </div>
            }
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    @if (onExtensionStep && pboSelection.length) {
        <button mat-raised-button (click)="back()">Back</button>
    }
    <button mat-raised-button color="primary" (click)="selectAll()">Select All</button>
    <app-flex-filler></app-flex-filler>
    @if (isLastStep) {
        <button mat-raised-button color="primary" (click)="submit()" [disabled]="!valid">Submit</button>
    } @else {
        <button mat-raised-button color="primary" (click)="next()">Next</button>
    }
</mat-dialog-actions>
