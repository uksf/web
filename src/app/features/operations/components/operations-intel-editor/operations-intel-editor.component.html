@if (missing) {
    <p class="empty">Not found</p>
} @else {
    <div class="content-container">
        <div class="content-header">
            <span class="document-title">{{ isEdit ? 'Edit intel page' : 'New intel page' }}</span>
            <div class="buttons-container">
                <app-button [secondary]="true" (clicked)="cancel()">Cancel</app-button>
                <app-button (clicked)="submit()" [disabled]="!model.title" [pending]="pending">{{ isEdit ? 'Save' : 'Create' }}</app-button>
            </div>
        </div>
        <form class="editor-form">
            <div class="editor-fields">
                <app-text-input label="Title" [(ngModel)]="model.title" name="title" id="title" [required]="true"></app-text-input>
            </div>
            <app-docs-editor [(content)]="model.body"></app-docs-editor>
            <app-form-value-debug-template></app-form-value-debug-template>
        </form>
    </div>
}
