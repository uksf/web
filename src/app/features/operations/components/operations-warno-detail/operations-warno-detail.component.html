@if (dto) {
    <div class="content-container">
        <div class="content-header">
            <div class="title-row">
                <button mat-icon-button class="back-button" [routerLink]="backLink" [matTooltip]="'Back to ' + dto.mission.title"><mat-icon>arrow_back</mat-icon></button>
                <span class="document-title">{{ dto.mission.title }} · WARNO</span>
            </div>
            <div class="buttons-container">
                @if (editing) {
                    <app-button [secondary]="true" (clicked)="cancelEdit()">Cancel</app-button>
                    <app-button (clicked)="save()" [pending]="pending">Save</app-button>
                } @else {
                    <ng-template [ngxPermissionsOnly]="['COMMAND']">
                        <app-button (clicked)="edit()">Edit</app-button>
                    </ng-template>
                }
            </div>
        </div>
        @if (editing) {
            <app-docs-editor [(content)]="draft"></app-docs-editor>
        } @else if (dto.mission.warno) {
            <app-docs-editor [content]="dto.mission.warno" [readonly]="true"></app-docs-editor>
        } @else {
            <div class="empty-state">
                <p class="empty">No WARNO</p>
            </div>
        }
    </div>
} @else if (missing) {
    <p class="empty">Mission not found</p>
} @else {
    <p class="empty">Loading…</p>
}
