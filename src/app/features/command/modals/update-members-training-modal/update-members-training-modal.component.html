<app-autofocus-stop></app-autofocus-stop>
<h2 mat-dialog-title>Update Training</h2>
<mat-dialog-content>
    <form #form="ngForm" (ngSubmit)="submit()">
        <mat-radio-group [(ngModel)]="model.remove" name="formRemove" class="mode">
            <mat-radio-button [value]="false" color="primary">Add</mat-radio-button>
            <mat-radio-button [value]="true" color="primary">Remove</mat-radio-button>
        </mat-radio-group>
        <app-selection-list
            [(ngModel)]="model.accounts"
            [elementName]="'Member'"
            [elements]="accounts"
            [clearOnSelect]="true"
            [isRequired]="true"
            [placeholder]="'Add member'"
            id="accountList"
            name="formAccountList"
        >
            <ng-template #element let-element>
                {{ element.displayValue }}
            </ng-template>
        </app-selection-list>
        <app-selection-list
            [(ngModel)]="model.trainings"
            [elementName]="'Training'"
            [elements]="trainings"
            [clearOnSelect]="true"
            [isRequired]="true"
            [placeholder]="'Add training'"
            id="trainingList"
            name="formTrainingList"
        >
            <ng-template #element let-element>
                {{ element.displayValue }}
            </ng-template>
        </app-selection-list>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <app-button (clicked)="submit()" [disabled]="!form.valid || !model.accounts.length || !model.trainings.length" [pending]="pending">
        {{ model.remove ? 'Remove' : 'Add' }}
    </app-button>
</mat-dialog-actions>
